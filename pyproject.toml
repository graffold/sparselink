[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparselink"
version = "1.0.0"
description = "Domain-agnostic sparse network inference from tabular data"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pandas>=1.5",
    "rich>=13.0",
]

[project.scripts]
sparselink-bench = "sparselink.bench.cli:main"
sparselink-benchmark = "sparselink.bench.run_benchmark:main"
sparselink-tui = "sparselink.tui:main"

[project.optional-dependencies]
causal = ["causal-learn"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]
test = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]
deep = ["torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparselink"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pandas.*", "causallearn.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sparselink --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["sparselink"]
omit = ["*/bench/cli.py", "*/bench/run_benchmark.py", "*/tui.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sparselink"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
